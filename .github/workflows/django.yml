name: Django

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Django configuration and migrations
        working-directory: literature_lab
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: literature_lab
        run: |
          python -m coverage run --source=chatbot manage.py test --verbosity 2
          python -m coverage report --show-missing
